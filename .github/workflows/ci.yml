name: Lightweight retrieval tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-demo.txt pytest httpx
      - run: pytest tests/test_lightweight_retrieval.py -q
